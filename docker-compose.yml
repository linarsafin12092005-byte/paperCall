services:

  mysql:
    image: mysql:8.4
    container_name: callflow-mysql
    environment:
      MYSQL_DATABASE: callflow
      MYSQL_USER: callflow
      MYSQL_PASSWORD: callflow_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callflow-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/callflow
      DB_USERNAME: callflow
      DB_PASSWORD: callflow_password
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: