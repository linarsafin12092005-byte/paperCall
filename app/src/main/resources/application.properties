spring.application.name=callflow-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/callflow}
spring.datasource.username=${DB_USERNAME:callflow}
spring.datasource.password=${DB_PASSWORD:callflow_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=callflow-api
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.callflow.api.event

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://jaeger:4318/v1/traces

asterisk.ami.host=${ASTERISK_HOST:localhost}
asterisk.ami.port=${ASTERISK_AMI_PORT:5038}
asterisk.ami.username=callflow
asterisk.ami.password=callflow_ami_password
